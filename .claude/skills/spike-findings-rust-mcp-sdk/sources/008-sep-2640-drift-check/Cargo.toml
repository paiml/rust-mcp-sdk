[package]
name = "spike-008-sep-2640-drift-check"
version = "0.1.0"
edition = "2021"
publish = false

# Deps beyond the spike baseline (pmcp / tokio / serde_json / anyhow):
# - sha2: SEP-2640 skill entries carry `sha256:{hex}` digests per file. The
#   spike computes conforming digests out-of-band to prove the shipped Skill
#   data model is SUFFICIENT for the new wire shape (the gap is API surface,
#   not data). Justified per CONVENTIONS.md "dep additions are per-spike".
[workspace]

[dependencies]
pmcp = { path = "../../..", default-features = false, features = ["skills"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"

[[bin]]
name = "spike-008"
path = "src/main.rs"
