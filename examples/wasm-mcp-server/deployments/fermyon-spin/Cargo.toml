[package]
name = "mcp-fermyon-spin"
version = "0.1.0"
edition = "2021"
# Example crate, never shipped to crates.io. This is the single opt-out
# recognised by scripts/check-release-coverage.sh; without it this manifest
# matches that gate's discovery RULE (its own [workspace] table below) while
# lying outside its scanned scope, so the gate would report full coverage for a
# crate it never checked.
publish = false

[dependencies]
spin-sdk = "3"
pmcp = { path = "../../../..", default-features = false, features = ["wasm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
futures = "0.3"

[lib]
name = "mcp_fermyon_spin"
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "z"

# Exclude from parent workspace
[workspace]