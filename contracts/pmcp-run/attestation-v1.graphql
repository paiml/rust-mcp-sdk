# attestation-v1.graphql — pmcp.run attestation-verification contract (SDL subset)
# Version:  v1 — PROPOSED, NOT RATIFIED
#
# STATUS: SDK-PROPOSED. NOT PLATFORM-EXPORTED. AWAITING RATIFICATION.
#
# THE ASK: docs/platform-requests/package-portability-alignment.md, the numbered
# "Attestation contract — ratify one operation" subsection, states exactly what we
# are asking the platform for and why. Read it before reading this schema.
#
# This file was written by the SDK side. No introspection export produced it, and the
# pmcp.run platform team has not yet responded to it. NOTHING IN IT IS AUTHORITATIVE
# UNTIL THEY DO. It deliberately carries no `Source:` and no `Exported:` line, because
# it has no provenance — imitating one would be a lie about who owns it.
#
# OWNERSHIP: contrast its sibling `capture-v1.graphql`, which WAS exported from the live
# pmcp.run AppSync API on 2026-07-20 and whose CONTENTS the platform owns — when the
# capture schema changes, the platform re-exports and PRs an update there, and the SDK's
# blocking test forces cargo-pmcp to follow in the same PR. This file inverts that
# relationship: the SDK owns it only because nobody else has claimed it, and the moment
# the platform ratifies or counter-proposes, its export replaces this proposal wholesale.
#
# WHAT THE BLOCKING TEST CAN AND CANNOT PROVE:
# `cargo-pmcp/tests/package_attestation_contract.rs` validates the CLI's operation string
# against THIS file with apollo-compiler, offline. Because both halves are SDK-written, it
# pins SDK-INTERNAL agreement today — the operation string and the proposed schema cannot
# drift apart. It becomes a real cross-boundary drift net the moment the platform exports
# its own SDL to replace this one. It cannot detect drift from a platform that has not
# spoken, and no reader should mistake a green build for platform agreement.
#
# SCOPE (D-11): `verifyAttestation` ONLY.
#   The attestation ARRIVES INSIDE THE PACKAGE — that is what carriage means — so the CLI
#   never fetches one, and a `getAttestation` operation would be speculative until import
#   semantics settle. Issuance is entirely the platform's to design, so an
#   `issueAttestation` operation is not the SDK's to propose. Both omissions are DECISIONS,
#   not oversights. Proposing the minimum for a contract we do not own means the platform
#   ratifies ONE operation, not three.
#
#   Why the SDK needs this remote call at all: verification against pmcp.run's identity is
#   a signature check, and the SDK holds no keys and adds no crypto dependency, so it
#   cannot perform one offline. The SDK's own offline check is subject-digest comparison
#   and nothing more.
#
# NO ENUMS: `verdict` is String! — do NOT tidy it into a GraphQL enum. An enum makes any
# later schema-versus-schema diff show permanent drift. This is the same discipline
# `capture-v1.graphql` records for its `status` fields, kept deliberately identical so a
# future platform export can be diffed against this proposal without normalization.
#
# ROOT TYPE: `Query`, not `Mutation` — verification is a READ. The platform inspects bytes
# the caller already holds and answers; nothing is created, stored or mutated. If
# ratification moves it to `Mutation`, that is a contract change, and the blocking test
# will demand the CLI's operation follow it in the same PR.

type Query {
  # attestationPayloadBase64: the attestation blob's RAW BYTES, base64-encoded with the
  #   STANDARD alphabet (RFC 4648 section 4, with padding). The bytes are the verbatim
  #   content of the package's `application/vnd.pmcp.attestation.v1` layer — the SDK never
  #   re-serializes or canonicalizes them, because that would change the bytes the platform
  #   signed. Encoded by `cargo_pmcp::pmcp_run_graphql::verify_attestation_request_body`.
  #   Typed String because GraphQL has no bytes scalar and the SDK will not invent one for
  #   a contract it does not own.
  #
  # subjectManifestDigest: the `sha256:...` OCI MANIFEST digest the SDK RE-DERIVED LOCALLY
  #   from the package it is holding — specifically the digest that package WOULD have if
  #   packed with no attestation layer. It is supplied so the platform can answer about
  #   THIS artifact rather than about whatever the attestation claims as its own subject.
  #   The SDK's separate offline check compares this value against the attestation
  #   descriptor's recorded subject; that comparison is not what this call performs.
  #
  #   NOT A PAYLOAD DIGEST, and the argument was RENAMED to say so (2026-08-26). It was
  #   `subjectPayloadDigest` until the pmcp.run team reviewed this proposal and pointed
  #   out that in their vocabulary `payload_digest` and `oci_manifest_digest` are two
  #   DISTINCT values — their `publish.rs` returns both as separate fields — and that
  #   conflating them already cost them a live production bug in their Phase 171 (import
  #   pulled by payload digest, ECR indexes by OCI-manifest digest, "image not found").
  #   Removing the attestation layer changes the OCI manifest digest and NOT the payload
  #   digest, so the value this argument carries is unambiguously the OCI one. The old
  #   name pointed at the wrong digest in exactly the way that had already burned them
  #   once. Renamed before ratification, which is the cheap moment to do it.
  verifyAttestation(
    attestationPayloadBase64: String!
    subjectManifestDigest: String!
  ): VerifyAttestationReturnType
}

type VerifyAttestationReturnType {
  # The platform's answer. String, never an enum — see the NO ENUMS note above. The
  # vocabulary is the platform's to define at ratification; the SDK treats it as opaque
  # text and does not branch on it in this phase.
  verdict: String!

  # The identity the platform verified the signature AGAINST — the whole point of the
  # remote call. Its exact spelling (key id, issuer URI, org identifier) is the platform's
  # to define.
  verifiedIdentity: String!

  # When the platform performed the verification (RFC 3339). String, matching
  # `capture-v1.graphql`'s `createdAt` / `updatedAt` discipline.
  verifiedAt: String!
}
