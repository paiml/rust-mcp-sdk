# === JSON Schema 2020-12 + Caching Hints (Phase 115) ===
# Written in wave 1, BEFORE the implementation plans ran (CLAUDE.md § Contract-First
# Development). Twelve of the thirteen entries landed as `status: planned` — the
# functions did not exist yet — with `CallToolResult::structured` the exception, an
# entry that exists today and records the D-06 freeze.
#
# 115-10 (wave 6) flipped ALL of them to `implemented` once every owning plan had
# landed, verified each `signature:` against the shipped source, and added a
# fourteenth binding for `compile_for_era`, which 115-03 delivered without a
# contract entry (deferred item, ledger entry J). From that point the ghost-binding
# check in tests/phase115_contract_bindings.rs is LOAD-BEARING over every entry:
# a binding naming a symbol nobody wrote now fails the gate.
#
# 115-12 added a fifteenth and sixteenth — `first_legacy_dialect` and
# `pin_dialect_in_place` — for the same reason `compile_for_era` was added: they ARE
# the mechanism `normalize_schema_dialect` delegates to, and the safety property the
# `output_schema_draft_pin` invariants assert is a property of their agreement.
#
# `planned` was never an exemption — tests/phase115_contract_bindings.rs scopes it to
# exactly these three equations so it cannot become an escape hatch elsewhere. There
# are now ZERO `planned` bindings in this file, which is the intended end state.

- contract: mcp-protocol-sdk-v1.yaml
  equation: output_schema_draft_pin
  function: warn_on_schema_mismatch
  module_path: pmcp::server::output_validation
  signature: 'pub(crate) fn warn_on_schema_mismatch(tool: &str, schema: &Value, value: &Value, era: Option<Era>)'
  status: implemented
  notes: >-
    Written by 115-03 Task 2. Exists today with the same name but WITHOUT the trailing
    `era` parameter; the plan threads the era through as the LAST parameter so the
    no-feature arm stays a plain `let _ = (…);`. SCHM-01 / D-01.

- contract: mcp-protocol-sdk-v1.yaml
  equation: output_schema_draft_pin
  function: schema_mismatch
  module_path: pmcp::server::output_validation
  signature: 'pub(crate) fn schema_mismatch(schema: &Value, value: &Value, era: Option<Era>) -> Option<String>'
  status: implemented
  notes: >-
    Written by 115-03 Task 2. `#[cfg(feature = "validation")]`. Returns `Some` on mismatch
    AND on a schema that fails to compile — the message names `outputSchema` in the latter
    case. Warn-only on both eras. SCHM-01 / D-01.

- contract: mcp-protocol-sdk-v1.yaml
  equation: output_schema_draft_pin
  function: cached_validator
  module_path: pmcp::server::output_validation
  signature: 'fn cached_validator(era: Option<Era>, schema: &Value) -> Result<std::sync::Arc<jsonschema::Validator>, std::sync::Arc<str>>'
  status: implemented
  notes: >-
    Written by 115-03 Task 2. `#[cfg(feature = "validation")]`. The cache key becomes
    `(Era, canonical schema text)` so one era's validator is never served to the other;
    the Arc-cached, error-cached, poison-recovering shape is preserved. SCHM-01 / D-01.
    115-10 SIGNATURE CORRECTION: 115-11 recorded the return type as
    `Result<Arc<…>, Arc<str>>`; the shipped source writes both paths in full
    (`std::sync::Arc`) because the `use` is function-local. Same types, different
    spelling — recorded rather than silently rewritten (ledger entry F).

- contract: mcp-protocol-sdk-v1.yaml
  equation: output_schema_draft_pin
  function: normalize_schema_dialect
  module_path: pmcp::server::output_validation
  signature: "fn normalize_schema_dialect(schema: &Value) -> std::borrow::Cow<'_, Value>"
  status: implemented
  notes: >-
    Written by 115-03 Task 3(b). `#[cfg(feature = "validation")]`. Pure and idempotent:
    `Cow::Borrowed` when no string-valued `$schema` in any SCHEMA POSITION of the document
    names a dialect other than `DRAFT_2020_12`, otherwise a clone in which every such
    `$schema` is overwritten with `DRAFT_2020_12`. SCHEMA POSITION is the scope the
    equation's `walk:` clause defines: the root, plus every node reached by descending into
    every member value EXCEPT a `const` / `enum` / `default` / `examples` payload, plus every
    VALUE of a `properties` / `patternProperties` / `$defs` / `definitions` /
    `dependentSchemas` / `dependencies` map whatever author-chosen name it is filed under,
    plus every ELEMENT of an array-valued member (`allOf` / `anyOf` / `oneOf` / `prefixItems`)
    whatever its index — 115-20, `115-REVIEW.md` WR-03.
    Touches no other key, and never a `$schema` that is instance DATA (a `properties` entry
    named `$schema`, or a `const` / `enum` / `default` / `examples` payload). SCHM-01 / D-02.
    115-12 SCOPE CORRECTION: this note previously read "`Cow::Borrowed` when the ROOT `$schema`
    is absent or already 2020-12 … Touches no other key and no nested `$schema`", describing a
    root-only rewrite. `115-VERIFICATION.md` measured that scope as a validation BYPASS — a
    legacy declaration on an embedded schema resource (a subschema carrying its own `$id`,
    which 2020-12 sanctions and `jsonschema` 0.49.2 honours) survived the pin and resolved an
    empty vocabulary set there, yielding `(v1, v2) = (Violates, Conforms)`, i.e. v2 validating
    WEAKER than v1. 115-12 made the walk recursive; the `signature:` above is unchanged and
    stays byte-identical to the source. See also `first_legacy_dialect` and
    `pin_dialect_in_place` below.
    115-14 POSITION CORRECTION: the note above described a walk that keyword-filtered the keys
    of subschema MAPS. `115-VERIFICATION.md` measured that scope as a validation BYPASS —
    `properties`, `patternProperties`, `$defs`, `definitions` and `dependentSchemas` map
