    the pre-fix run reporting that postcondition as PASSING for the very documents that were
    never rewritten. The `signature:` above is unchanged and stays byte-identical to the
    source.
    115-16 COMPLETENESS CORRECTION: the rule both halves recite was measured INCOMPLETE as
    well as previously wrong — `SUBSCHEMA_MAP_KEYWORDS` omitted `dependencies`, so this
