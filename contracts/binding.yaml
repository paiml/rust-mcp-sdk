# (116-02, 116-04, 116-05) — not a transcription of shipped code, because no code
# exists yet. That is the whole point: the signature is committed before the body.
#
# All eight entries were authored `planned` (they are `implemented` as of 116-15 —
# see HAND-OFF DISCHARGED below). Two gates read this file and both were
# checked before the value was introduced:
#   * `make comply` -> `comply-bindings-check` (Makefile:818-834) resolves `function:`
#     values ONLY in contracts/team-servers/binding.yaml, so it is unaffected; and
