#     `phase115_contract_bindings_planned_entries_are_scoped_to_phase_115` confines
#     `planned` to a named equation list. Its own failure message says a future phase
#     needing contract-first `planned` bindings must "extend PHASE_115_EQUATIONS
#     deliberately in this file — that edit is the conversation this test exists to
