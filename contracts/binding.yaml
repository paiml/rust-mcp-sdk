    carries a legacy declaration while `compile_2020_12` announces the declaration as ignored.
    The postcondition `first_legacy_dialect(&owned) == None` is what fences that, and it
    replaces the `expect` the root-only body carried. SCHM-01 / D-02.
    115-14 POSITION CORRECTION: the traversal rule this note recites was measured WRONG, not
