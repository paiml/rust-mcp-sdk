    `dependencies`, so this detector reported `None` for a document carrying a legacy
    declaration on an `$id`-bearing embedded resource filed under a `dependencies` entry an
    author had named `default` — the same category error 115-14 closed, one keyword over
    (115-REVIEW.md CR-01). The sixth entry was established by DERIVATION over the draft-04 /
    -06 / -07 / 2019-09 / 2020-12 meta-schemas, not by patching the reviewed case, and
