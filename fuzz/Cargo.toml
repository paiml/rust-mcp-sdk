[package]
name = "pmcp-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Standalone workspace root: the fuzz crate is intentionally excluded from the
# parent pmcp workspace (see root Cargo.toml `workspace.exclude`). Declaring an
# empty `[workspace]` here stops Cargo from walking further up the directory
# tree, which is required when the repo is checked out as a git worktree (the
# parallel-agent layout) where an ancestor Cargo.toml would otherwise be
# mis-detected as this crate's workspace.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde = "1.0"
serde_json = "1.0"
bytes = "1.0"
base64 = "0.22"
arbitrary = { version = "1.3", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
pmcp-macros-support = { path = "../crates/pmcp-macros-support" }
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }

[dependencies.pmcp]
path = ".."
default-features = false
# `streamable-http` gates `src/server/request_state.rs` (D-14 locks the MRTR AEAD
# to native + that feature); `fuzzing` widens the module and exposes the
# `fuzz_support::verify_bytes` seam. `fuzzing` is in neither `default` nor `full`,
# so enabling it here adds nothing to the shipped public API.
#
# `validation` (Phase 115-09, SCHM-01) gates the `jsonschema` validator inside
# `src/server/output_validation.rs`: without it `compile_for_era` does not exist
# and `output_validation::fuzz_support` compiles to nothing, so
# `fuzz_schema_draft_pin` would have no seam to reach. `fuzzing` widens the
# MODULE, `validation` supplies its CONTENTS — both are required, which is why
# the seam itself is gated `#[cfg(all(feature = "fuzzing", feature =
# "validation"))]`.
features = ["oauth", "streamable-http", "fuzzing", "validation"]

[dependencies.pmcp-code-mode]
path = "../crates/pmcp-code-mode"
default-features = false
features = ["openapi-code-mode"]

[dependencies.mcp-tester]
path = "../crates/mcp-tester"

# Phase 118 (CONF-02): reaches
# `pmcp_team_servers::conformance::era_diff::parse_baseline`.
#
# `default-features = false` plus ONLY `conformance` is deliberate. The crate's
# default feature set attaches all four reference servers, and its `http`
# feature pulls `pmcp/streamable-http` + `pmcp/http` + `member-llm`, which drags
# reqwest and a native-only HTTP stack into a build that only ever hands a
# `&str` to a YAML parser. `conformance` alone gives the parser and nothing
# else, mirroring how `[dependencies.pmcp]` above narrows its own feature list
# to exactly the seams its targets reach.
[dependencies.pmcp-team-servers]
path = "../crates/pmcp-team-servers"
default-features = false
features = ["conformance"]

[[bin]]
name = "protocol_parsing"
path = "fuzz_targets/protocol_parsing.rs"
