# Phase 113-13 (HTTP-04): the `subscriptions/listen` CLIENT frame decoder runs on
# bytes supplied by a remote server, so it is fuzzed at that boundary.
[[bin]]
name = "subscription_listen_frames"
path = "fuzz_targets/subscription_listen_frames.rs"
test = false
doc = false
bench = false

# Phase 114-14 (TASK-02): the RAW `tasks/update` params boundary. `inputResponses`
# is the ENTIRE request payload and its decode is the one place in the tasks
# surface where guessing at overlapping result shapes is actively wrong (D-113-O),
# so the untrusted bytes are fuzzed where they arrive. Registration only — this
# target adds NO dependency; it reaches `task_dispatch::fuzz_support` through the
# `fuzzing` feature already enabled on the `pmcp` dependency above.
[[bin]]
name = "fuzz_tasks_update"
path = "fuzz_targets/fuzz_tasks_update.rs"
test = false
doc = false
bench = false

# Phase 116-08 (AUTH-01 / AUTH-03): the authorization-response callback query and
# the issuer identifier are BOTH fully attacker-controlled — a hostile
# authorization server picks every byte of the callback URL, and a hostile
# `mcp_server_url` picks every byte of the issuer that reaches the discovery URL
# arithmetic. Registration only: this target adds NO dependency. Both entry points
# live in the UNGATED pure tier `src/shared/oauth_validation.rs`, so it reaches
# them through the `pmcp` dependency above with no feature flag at all.
[[bin]]
name = "oauth_authorization_response"
path = "fuzz_targets/oauth_authorization_response.rs"
test = false
doc = false
bench = false

# Phase 116-08 (AUTH-02 / AUTH-03): the credential document that reaches
# `parse_credential_snapshot` comes off DISK before any authentication has
# happened, so a corrupt or attacker-planted `~/.pmcp/oauth-cache.json` is
# untrusted input with nothing in front of it; and a DCR response is bytes from a
# registration endpoint the client has, by construction, not yet authenticated.
# Registration only: this target adds NO dependency. All three entry points are
# pure ungated functions reached through the `pmcp` dependency above.
[[bin]]
name = "oauth_credential_and_dcr"
path = "fuzz_targets/oauth_credential_and_dcr.rs"
test = false
doc = false
bench = false

# Phase 115-09 (SCHM-01): the era-branched `outputSchema` validation path. A tool
# author's declared schema and a handler's emitted value are both arbitrary JSON,
# and emit-time validation runs on every structured result — a panic there is a
# remotely reachable unwind. Registration only: this target adds NO dependency, it
# reaches `output_validation::fuzz_support` through the `fuzzing` + `validation`
# features already enabled on the `pmcp` dependency above.
[[bin]]
name = "fuzz_schema_draft_pin"
path = "fuzz_targets/fuzz_schema_draft_pin.rs"
test = false
doc = false
bench = false

# Phase 117-08 (CLNT-04): the expected-difference baseline parser. The baseline
# is reachable from a user-supplied path, so arbitrary file bytes flow into
# `mcp_tester::era_diff::parse_baseline` — a panic there is a reachable unwind
# (T-117-27). Registration only: this target adds NO dependency, it reaches the
# parser through the `[dependencies.mcp-tester]` path entry already declared
# above.
[[bin]]
name = "era_deltas_parser"
path = "fuzz_targets/era_deltas_parser.rs"
test = false
doc = false
bench = false

# Phase 118 (CONF-02): the pmcp-team-servers sibling of the target above. The
# same class of defect on a different crate's baseline — arbitrary file bytes
# flow into `pmcp_team_servers::conformance::era_diff::parse_baseline` through
# `era_diff::load_baseline`, and a panic there is a reachable unwind (T-118-10).
# It reaches the parser through the `[dependencies.pmcp-team-servers]` path
# entry declared above, which enables ONLY the `conformance` feature so this
# build pulls no reqwest and no HTTP stack.
[[bin]]
name = "team_era_deltas_parser"
path = "fuzz_targets/team_era_deltas_parser.rs"
test = false
doc = false
bench = false
