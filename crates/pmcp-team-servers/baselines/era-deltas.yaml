    note: "TOKEN RE-CORRECTED by Phase 118.1 plan 05. This row was NOT named in plan 05's brief, and moved as a DIRECT consequence of closing G-5: `initialize` is one of the five methods the 2026-07-28 core schema removes, so widening the retirement past the two `resources/*` variants necessarily reaches it. History: seeded v2 `absent` / `method-removed`; Phase 118 plan 07 measured v2 `served` and corrected it to `served` / `era-agreement` because the SERVER still accepted initialize on v2; plan 05 retired it and re-measured `absent`, restoring the seeded value. That agreement with the independently-seeded row — and with crates/mcp-tester/baselines/era-deltas.yaml ERA-01, which still declares v1 `served` / v2 `absent` / `method-removed` — is why this is the fix landing rather than drift. Declared under D-21 in 118-CONFORMANCE-GAPS.md; its disposition rides with G-5's in plan 12."
