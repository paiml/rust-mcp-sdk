  # ---------------------------------------------------------------------------
  - id: ERA-01
    observation_id: method.initialize
    subject: "method:initialize"
    v1: served
    v2: served
    kind: era-agreement
    source: "MEASURED 2026-08-09 over the live era target: the v2 POST answers 200 with protocolVersion 2025-11-25. src/types/protocol/version.rs:22-33 (negotiate_protocol_version never returns 2026-07-28); the seeded claim cited src/client/mod.rs:592 and :761 (v2_synthetic_initialize_result), which is a CLIENT-side fact"
    note: "TOKEN CORRECTED by Phase 118 plan 07: seeded v2 `absent`, measured v2 `served`. The seeded row's own citation is client-side — a v2 pmcp client synthesizes its InitializeResult locally and never sends the request — while this probe is server-side, and the SERVER still accepts initialize for backward tolerance. Declared under D-21 in 118-CONFORMANCE-GAPS.md."
    provisional: false

  - id: ERA-02
    observation_id: method.server_discover
    subject: "method:server/discover"
    v1: "error:-32601"
    v2: served
    kind: method-added
    source: "src/server/core.rs:1944 (build_discover_response answers -32601 for any non-V2 request); :1180 (project_capabilities_for_v2)"
    note: "MEASURED 2026-08-09 by Phase 118 plan 07 against the live era target; reproduces exactly as seeded. v2 replaces the initialize handshake with a read-only capability projection."
    provisional: false

