    note: "MEASURED 2026-08-09 by Phase 118 plan 07; reproduces exactly as seeded. Phase 118 D-13 relaxes the Mcp-Name arm to name-bearing methods only; the strict header/body cross-check is kept where the header IS present, because a desync is a smuggling signal and is rejected fail-closed."
    provisional: false

