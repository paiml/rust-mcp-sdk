# =============================================================================
# EXPECTED-DIFFERENCE BASELINE — MCP 2025-11-25 (v1) vs MCP 2026-07-28 (v2)
# for the pmcp-team-servers ERA TARGET
# =============================================================================
#
# THIS FILE IS THE WRITTEN STATEMENT OF WHAT "DUAL-VERSION" MEANS FOR THE
# PHASE-118 ERA TARGET.
#
# Every entry below is a difference that is CORRECT BY DESIGN.
#
#   * Any observed v1/v2 difference NOT listed here is a FINDING.
#   * Any entry here that no longer reproduces is ALSO a FINDING — either the
#     spec moved, or we regressed.
#
# REVIEW THIS FILE LIKE A SPEC, NOT LIKE CONFIG. It is the adjudication surface
# for CONF-02 and CONF-03, and maintaining it IS the dual-version contract, not
# overhead on top of it.
#
# -----------------------------------------------------------------------------
# RECONCILED AGAINST MEASUREMENT — Phase 118 plan 07, 2026-08-09
# -----------------------------------------------------------------------------
# Every row below was seeded PROVISIONAL by plan 118-03 as a CLAIM AWAITING
# MEASUREMENT. (The literal flag spelling is deliberately not written out in
# this prose: a grep a comment can trip is a grep nobody trusts, and the
# release check for "no row is still provisional" is exactly such a grep.)
#
# Plan 118-07 measured all fourteen against the live era target over one
# streamable-HTTP endpoint and cleared every flag: twelve rows reproduced
# exactly as seeded, and TWO (ERA-01, ERA-11) had their v2 token corrected from
# the seeded decision to the measured fact. NO ROW IS AWAITING MEASUREMENT ANY
# MORE.
#
# -----------------------------------------------------------------------------
# RE-MEASURED — Phase 118.1 plan 05, 2026-08-10 (gap G-5 CLOSED)
# -----------------------------------------------------------------------------
# The same TWO rows moved BACK. Plan 118.1-05 widened v2 method retirement from
# the two `resources/*` variants to all five methods the 2026-07-28 core schema
# removes — `initialize`, `ping`, `logging/setLevel`, `resources/subscribe`,
# `resources/unsubscribe` — keyed on the method STRING at the v2 ingress. Both
# rows plan 118-07 had corrected TO `served` are probes of methods in that set,
# so both re-measured at their originally seeded values:
#
#   * ERA-01 `initialize`       v2 `served` -> `absent`        (kind: method-removed)
#   * ERA-11 `logging/setLevel` v2 `served` -> `error:-32601`   (kind: method-removed)
#
# Neither is drift. Both agree again with the independently seeded declarations
# in `crates/mcp-tester/baselines/era-deltas.yaml`, and both are asserted from
# the other end by `tests/v2_retired_methods.rs`, which drives all five methods
# with WELL-FORMED params over real HTTP on both eras.
#
# CONSEQUENCE FOR `kind: era-agreement`: it now has ZERO occupants. The cap in
# `tests/era_baseline.rs` is a `<=`, so the file stays conformant, and an
# unoccupied cap is the CORRECT resting state — the two rows that held the kind
# held it only because a gap was open.
#
# The test that re-derives this file is
# `era_matrix_is_conformant` in `crates/pmcp-team-servers/tests/era_matrix.rs`:
#
#     cargo test -p pmcp-team-servers --features http --test era_matrix
#
# (the `--features http` is load-bearing — without it the file is `cfg`-ed out
# and the run reports zero tests). If a row here stops matching what that test
# observes, the run FAILS in whichever direction the drift went.
#
# -----------------------------------------------------------------------------
# THE ID CONTRACT (this is what makes the file non-vacuous)
# -----------------------------------------------------------------------------
# Every `observation_id` here has a matching entry in
# `src/conformance/era_observations.rs::PROBE_REGISTRY`, AND every registry
# entry has a row here. BOTH DIRECTIONS are asserted by
# `tests/era_baseline.rs` (`every_baseline_entry_has_a_probe` and
# `every_probe_has_a_baseline_entry`). Adding a row without a probe, or a probe
# without a row, fails a test.
#
# That pairing is not bureaucracy. A row nothing observes can only ever be
# reported MISSING, in every run, forever; a probe with no row would report
# every run of it as UNEXPECTED. Either one trains a reviewer to ignore the
# gate, which is the failure mode this whole design exists to prevent.
#
# The REGISTRY is the authority, not this file: adding a row for a wire fact no
# probe reads fails `every_baseline_entry_has_a_probe`.
#
# -----------------------------------------------------------------------------
# WHY YAML AND NOT TOML
# -----------------------------------------------------------------------------
# `serde_yaml = "0.9"` is ALREADY resolved in this workspace — the root
# `Cargo.toml` carries it as a dev-dependency and `crates/mcp-tester/Cargo.toml`
# as a regular one — so reading this file costs ZERO new third-party packages.
# Adding the `toml` crate would be a NEW dependency on an already-published
# crate, which the CLAUDE.md package discipline requires justifying, and it
# would buy nothing. Comment support is the only property "legible enough to
# review as a spec artifact" actually needs, and YAML has it.
#
# -----------------------------------------------------------------------------
# THE FIELDS
# -----------------------------------------------------------------------------
#   id             Stable human-facing label, `ERA-NN`. Unique. Never reused.
#
#   observation_id The STABLE, MACHINE-FACING name of the WIRE FACT this entry
#                  is about — namespaced, lowercase, dot-separated. It is NOT a
#                  human-facing test name and MUST NEVER be renamed for
#                  readability.
#
#                  Its reason: `src/conformance/era_diff.rs::compare_eras` joins
#                  the observed v1/v2 difference set against this field.
#                  `CaseResult` (`src/conformance/runner.rs:306`) carries only
#                  `{case_id, passed, detail}` — no header, no session id, no
#                  result-envelope key, no HTTP status — so a comparison keyed on
#                  fixture pass/fail could never OBSERVE most of the entries
#                  below, and two eras both passing the same expected response
#                  would emit no observation at all. That is exactly the defect
#                  Phase 118 D-16 removed by porting the Phase-117 probe
#                  substrate instead.
#
#                  TEN of the fourteen values below are REUSED BYTE-IDENTICALLY
#                  from `crates/mcp-tester/baselines/era-deltas.yaml` because
#                  they name the SAME wire fact. Reusing the string is what lets
#                  the two baselines be read side by side.
#
#   subject        Human-readable wire surface the entry concerns.
#   v1 / v2        What each era does. Short tokens, not prose. The vocabulary
#                  here IS `ObservedValue::token()`'s vocabulary — one
#                  vocabulary, two files.
#   kind           Difference class, for grouping in a report. `era-agreement`
#                  is LOAD-BEARING — see below.
#
#   source         Citation a reviewer can check WITHOUT READING RUST. A label
#                  ("D-07", "spec") is not a citation; `tests/era_baseline.rs`
#                  enforces a `MIN_SOURCE_CHARS` floor precisely so a label
#                  cannot pass for one.
#
#   note           Optional prose. REQUIRED on provisional entries, where it
#                  must name the phase that owns the entry.
#
#   provisional    Set when the owning phase is not signed off, so a change
#                  there produces a LEGIBLE BASELINE EDIT rather than a mystery
#                  test failure. AFTER PLAN 118-07, NO ROW CARRIES IT.
#
# -----------------------------------------------------------------------------
# `kind: era-agreement` — A MEASURED SAMENESS, NOT AN EXEMPTION
# -----------------------------------------------------------------------------
# NO ROW CARRIES THIS KIND ANY MORE. Two did — ERA-01 and ERA-11, recording
# that `initialize` and `logging/setLevel` were still SERVED on v2 even though
# the 2026-07-28 schema removes both. Phase 118.1 plan 05 implemented the
# retirement, so the two eras differ again and both rows are back to
# `kind: method-removed`. The mechanism is documented here in full because it is
# a live capability of the format, not because anything currently uses it, and
# because the reasoning below is what a future reviewer needs before reaching
# for it. THE BAR FOR REACHING FOR IT IS: the two eras genuinely MEASURE the
# same token, and a phase decision records why the sameness is acceptable.
#
# Note the shape of what happened: the rows were NOT deleted while the gap was
# open. Deleting them would have deleted their probes too, under the id contract
# above, and with them the only thing that would ever have noticed the
# retirement landing. Keeping them as measured agreements is precisely what made
# plan 05's fix show up as a finding rather than as silence.
#
# THIS IS NOT AN ALLOWLIST OF FAILURES, and nothing about it suppresses a suite
# result. It is a claim that fires in BOTH directions:
#
#   * if the two eras ever START differing for that id, the observed pair no
#     longer agrees with the recorded pair and the matrix reports UNEXPECTED;
#   * if either token MOVES while the two still agree, the observed pair no
#     longer equals the recorded pair and the matrix reports MISSING.
#
# Three independent conditions are required before a row is treated this way,
# and `tests/era_baseline.rs` + `tests/era_matrix.rs` check all three: `kind`
# must be exactly `era-agreement`, the row's own `v1` and `v2` must be equal,
# and BOTH OBSERVED tokens must equal that recorded value. The number of such
# rows is additionally CAPPED (`MAXIMUM_AGREEMENT_ROWS` in
# `tests/era_baseline.rs`), so the mechanism cannot quietly grow into a general
# escape hatch. The cap is a `<=`, so the current occupancy of ZERO is
# conformant — and it is the correct resting state.
#
# The sameness the two rows recorded was gap G-5 under Phase 118 decision D-21;
# see
# `.planning/phases/118-conformance-against-the-official-suite/118-CONFORMANCE-GAPS.md`.
# G-5 is CLOSED as of Phase 118.1 plan 05; its FIXED disposition is recorded
# with the other eight in plan 12, per D-10.
#
# -----------------------------------------------------------------------------
# WHERE THE `provisional` EXEMPTION LIVES
# -----------------------------------------------------------------------------
# `compare_eras` classifies a provisional entry as MISSING, exactly like a
# non-provisional one — the flag is carried on the classified row and changes
# only the RENDER (`[PROVISIONAL]` instead of nothing). Any exemption is applied
# by the CONSUMING test, where it is visible, and never by the comparator, where
# a stale provisional row would become permanently invisible. After plan 118-07
# no row carries the flag, so that exemption is dead by construction and
# `era_matrix_is_conformant` asserts a provisional-MISSING count of zero.
# =============================================================================

schema_version: 1
v1_protocol: "2025-11-25"
v2_protocol: "2026-07-28"

deltas:
