[package]
name = "pmcp-team-servers"
version = "0.1.0"
edition = "2021"
description = "Dev-grade reference team servers (team-fs, mem-mcp, approval-mcp, team-mcp) for the PMCP SDK (experimental)"
license = "MIT"
readme = "README.md"
rust-version = "1.91.0"
# .planning/ (GSD scaffolding), fuzz/ (workspace-excluded cargo-fuzz sub-package),
# and tests/ (property fixtures) are never relevant to downstream consumers —
# keep them out of the published crates.io tarball (mirrors pmcp-sql-server).
exclude = [".planning/", "fuzz/", "tests/"]

[dependencies]
# The client/server/tasks/peer surface these reference servers need is NOT
# feature-gated in pmcp — it compiles unconditionally on native (only
# `not(target_arch = "wasm32")`-gated). `default-features = false` therefore
# gives us everything while staying wasm-clean (no reqwest). The `_meta` carrier
# (RequestHandlerExtra.request_meta) landed additively in the local 2.17.x via
# 109-00; the path dep provides the source regardless of exact minor.
pmcp = { version = "2.17.0", path = "../..", default-features = false }
pmcp-agent = { version = "0.2", path = "../pmcp-agent" }
pmcp-package = { version = "0.1", path = "../pmcp-package" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
async-trait = "0.1"
thiserror = "2.0"
uuid = { version = "1.17", features = ["v4"] }
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# The DECLARED sync primitive for the in-memory backends (109-03 review): already
# vendored via pmcp, no new third-party registry package in the default build.
parking_lot = "0.12"
# clap + tracing-subscriber are used only by the `[[bin]]` targets. They are
# wasm-compatible regular deps (no special class); the binaries are native-only
# by nature of serving a transport.
clap = { version = "4", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Optional HTTP client for the webhook approval-notification path (109-04). OFF
# by default so the default + wasm32 build never pulls reqwest.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }
# URL type for the HTTP conformance target (109-07). Already vendored via pmcp;
# gated behind the non-default `http` feature so the default/wasm build never
# pulls it as a direct dep.
url = { version = "2", optional = true }
# Reader for the expected-difference baseline consumed by
# `src/conformance/era_diff.rs` (Phase 118, CONF-02). serde_yaml 0.9 is ALREADY
# resolved in this workspace — the root `Cargo.toml` carries it as a dev-dep and
# `crates/mcp-tester/Cargo.toml` as a regular one — so this line costs ZERO new
# third-party packages. Gated on `conformance` (a default feature) so a
# single-server build (`--no-default-features --features team-fs`) does not pull
# a YAML reader it never calls.
serde_yaml = { version = "0.9", optional = true }

[features]
# default = the full reference-server set; this crate's purpose IS all four
# servers plus the conformance harness. `webhook` + `http` are the ONLY
# non-default toggles (off by default → the default/wasm32 build is
# reqwest-free and pulls no native-only HTTP stack).
default = ["team-fs", "mem-mcp", "approval-mcp", "team-mcp", "conformance"]
team-fs = []
mem-mcp = []
approval-mcp = []
team-mcp = []
# The fixture-replay harness PLUS the Phase-118 era substrate
# (`era_observations` / `era_diff`). The latter reads the checked-in
# `baselines/era-deltas.yaml`, hence `dep:serde_yaml`.
conformance = ["dep:serde_yaml"]
# Outbound approval-notification webhook (109-04) needs reqwest.
webhook = ["dep:reqwest"]
# team-mcp members run against a real LLM over an OpenAI-compatible endpoint
# (Ollama / OpenAI-compat). OFF by default so the default + wasm32 build never
# pulls reqwest via pmcp-agent; `resolve_member_factory`'s concrete-source
# branch is gated on this. Tests/CI use an INJECTED FixedSource override and
# never need it.
member-llm = ["pmcp-agent/openai-compat"]
# HTTP serve path for the server binaries needs pmcp's native-only
# StreamableHttpTransport (server side). The conformance runner's HTTP
# `ClientTarget` (D-19) additionally needs pmcp's client-side `HttpTransport`,
# which lives behind pmcp's separate `http` feature — enable both so a
# dev-dependency-free `cargo build --all-features` / `cargo publish` compiles
# (the `full` dev-dep previously masked this via feature unification). The
# HTTP-first team-mcp binary also serves members against a real LLM, so `http`
# pulls in `member-llm`. Gated so a stdio-only build stays clean.
#
# `dep:reqwest` (Phase 118, CONF-02/CONF-03): the era probes in
# `src/conformance/era_probe.rs` need a RAW HTTP client because the typed
# `pmcp::Client` surface deliberately hides the wire facts the era baseline is
# made of — response headers, HTTP statuses and raw envelope keys. `http` is
# NON-DEFAULT and already pulls reqwest transitively via `member-llm`
# (`pmcp-agent/openai-compat`), so naming it here costs ZERO new registry
# packages (T-118-SC) and the DEFAULT and wasm32 builds stay reqwest-free —
# which is the property this feature block exists to protect (T-118-71).
#
# `pmcp/testing` (Phase 118): a raw v2 request body cannot be built without the
# three reserved `_meta` key spellings, because the server's era gate requires
# the `MCP-Protocol-Version` HEADER and the `_meta` value to AGREE and rejects a
# header-only claim with `-32020 HEADER_MISMATCH`. pmcp's own constants are
# `pub(crate)` (`src/types/protocol/context.rs:304`) and their only public
# re-export (`pmcp::testing::META_*`) sits behind pmcp's `testing` feature.
# `testing = []` is a ZERO-DEPENDENCY code gate (root `Cargo.toml:311`), and the
# in-repo `s52` example enables it for exactly this reason ("the example reads
# the reserved `_meta` key spellings from `pmcp::testing`"), so this is the
# sanctioned pattern rather than re-spelling the strings here and hoping they do
# not drift.
#
# `pmcp/v1-compat` (Phase 118): the v1 SESSION + RESUMABILITY compatibility layer.
# It is a member of pmcp's `default`, but this manifest pins
# `default-features = false`, so it was OFF here and only appeared through the
# `full` DEV-dependency — the classic feature-unification false green
# (`cargo test` sees dev-deps, `cargo build` does not). It is load-bearing for
# the era comparison in three separate places: `StreamableHttpServerConfig`'s
# `session_id_generator` field and `http_constants::LAST_EVENT_ID` are both
# `#[cfg(feature = "v1-compat")]`, and without them the era target has no v1
# session path at all — so `header.mcp_session_id`, `header.last_event_id` and
# `http.verb.get_delete` would report the SAME token under both eras and three
# observations would silently collapse. `v1-compat = []` is a zero-dependency
# code gate, so this costs no package either.
http = [
  "pmcp/streamable-http",
  "pmcp/http",
  "pmcp/testing",
  "pmcp/v1-compat",
  "member-llm",
  "dep:url",
  "dep:reqwest",
]
# Aggregate: all four server surfaces attached at once. compose::wiring (109-06)
# cfg-gates its attachment branches behind this.
runtime = ["team-fs", "mem-mcp", "approval-mcp", "team-mcp"]

# One bin per reference server. Explicit hyphenated `name` + underscored `path`
# (following the pmcp-sql-server precedent) so downstream `--bin team-fs` /
# `env!("CARGO_BIN_EXE_team-fs")` resolve. `required-features` is gated ONLY on
# the server feature, NOT `http`, so a stdio-only build works without the HTTP
# stack (each bin's HTTP serve path is `#[cfg(feature = "http")]`).
[[bin]]
name = "team-fs"
path = "src/bin/team_fs.rs"
required-features = ["team-fs"]

[[bin]]
name = "mem-mcp"
path = "src/bin/mem_mcp.rs"
required-features = ["mem-mcp"]

[[bin]]
name = "approval-mcp"
path = "src/bin/approval_mcp.rs"
required-features = ["approval-mcp"]

[[bin]]
name = "team-mcp"
path = "src/bin/team_mcp.rs"
required-features = ["team-mcp"]

# The doc-review E2E example (109-08, D-16) composes all four servers via the
# in-process runtime, so it needs the full `runtime` server set. `required-features`
# keeps a reduced-feature build (e.g. `--no-default-features --features team-fs`)
# from trying — and failing — to compile it.
[[example]]
name = "doc_review_team"
required-features = ["runtime"]

[dev-dependencies]
pmcp = { version = "2.17.0", path = "../..", features = ["full"] }
tokio = { version = "1", features = ["full"] }
proptest = "1.7"
pretty_assertions = "1.4"
tempfile = "3"
# Only to construct `TeamPackage { version, ... }` in derive property tests
# (its fields are `semver::Version`/`VersionReq`). Already in the workspace tree
# via pmcp-package; test-only, so it never affects the published build.
semver = "1"
