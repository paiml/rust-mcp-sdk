# This crate is a standalone member of NEITHER the root workspace nor any other
# workspace. The empty [workspace] table prevents Cargo from walking up to a
# parent workspace, so `cd crates/pmcp-package && cargo test` runs standalone
# without escaping into an unrelated ancestor workspace. Each consuming
# workspace adds it as a path dep and resolves its own pinned versions.
[workspace]

[package]
name = "pmcp-package"
version = "0.3.1"
edition = "2021"
authors = ["PMCP SDK Contributors"]
license = "MIT OR Apache-2.0"
description = "AI-Package format for portable MCP agent/server/team/workflow packages: typed manifest schemas, config-slot aggregation, local OCI pack/unpack, and canonical-digest computation."
repository = "https://github.com/paiml/rust-mcp-sdk"
documentation = "https://docs.rs/pmcp-package"
readme = "README.md"
keywords = ["mcp", "packaging", "oci", "agent", "manifest"]
categories = ["development-tools", "encoding"]
publish = true

[dependencies]
# OCI Image/Distribution spec types: Descriptor, Digest, MediaType — the same
# types oci-client natively consumes, zero translation layer.
oci-spec = "0.10"
# Canonical JSON formatter (OLPC/Docker/Notary/TUF-compatible) for a stable
# manifest digest. Already a transitive dependency of oci-client.
olpc-cjson = "0.1.4"
# SHA-256 digest computation. Pinned to 0.10 to match the repo-wide workspace
# pin — do NOT bump to 0.11 (breaking API change).
sha2 = "0.10"
# Version/VersionReq for component ranges (e.g. london-tube@^1.2) and exact
# pins. The `serde` feature is REQUIRED: semver::Version/VersionReq are
# embedded in serializable structs — without it those derives fail to compile.
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Hex-encoding sha256 output into the `sha256:<hex>` digest string form.
# Same crate oci-client depends on for the same purpose.
hex = "0.4"
# RUNTIME (promoted from dev-only in plan 120-05, PR-04). `pack_server` reads
# the `[[config_slots]]` declaration table out of the SAME config bytes it is
# packing (D-01: "pack reads them") and resolves the dotted TOML path each
# declared slot names, so the config document has to be PARSED here rather than
# in the caller.
#
# The reach is deliberately narrow and stated so it can be checked: this crate
# reads ONE table and resolves ONE dotted key per slot. It models no config
# schema, holds no opinion about the toolkit's config shape, and NEVER
# re-serializes the document — the config layer's bytes stay verbatim, exactly
# as they were handed to `pack_server`.
#
# Supply chain (T-120-25): `toml` has been on crates.io since 2014-11-11 with
# ~15.2M downloads/week from `github.com/toml-rs/toml`, audited OK in this
# phase's RESEARCH package-legitimacy table. It is deliberately NOT behind a
# cargo feature: `make pmcp-package-gate` runs exactly one build configuration,
# so a feature axis here would be a gate blind spot on the very code that
# upholds "secrets never travel".
#
# PINNED ON THE 1.x LINE, deliberately, for two reasons that only appeared when
# this dep was promoted from dev-only to runtime:
#
#  1. TOML-SPEC PARITY. This crate parses the SAME config bytes that
#     `pmcp-server-toolkit` parses at boot, and that crate is on `toml = "1"`
#     (Cargo.toml:27). `toml` 0.8 implements TOML 1.0 while 1.x implements
#     TOML 1.1, so a 0.8 pin here means a config using any 1.1-only construct
#     (a trailing comma or newline inside an inline table, a `\e`/`\x` escape,
#     a non-ASCII bare key) BOOTS but fails to PACK — the "packs cleanly and
#     then fails at boot" bug in its mirror image, which is exactly the class
#     `env_ref_grammar_v1.tsv` exists to keep closed.
#  2. ONE `toml` IN THE GRAPH. A dev-dep of a path dependency is never built
#     by consumers; a runtime dep is. On 0.8 this promotion pulled the whole
#     0.8 family (toml_edit 0.22, toml_datetime, serde_spanned, winnow) into
#     every build of `cargo-pmcp`, `pmcp-agent`, `pmcp-team-servers` and
#     `pmcp-cfn-renderer` ALONGSIDE the 1.x family the root workspace already
#     compiles. `deny.toml` sets `multiple-versions = "warn"`, so nothing
#     flagged it.
toml = "1"

[dev-dependencies]
proptest = "1.11"
# Explicit temp-dir dev-dep for the OCI layout tests — do NOT hand-roll temp dirs.
tempfile = "3"

# docs.rs build configuration (PKG-01): the crate has no cargo features, so
# all-features is a no-op safety net; docsrs cfg enables doc_cfg badging if used.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
