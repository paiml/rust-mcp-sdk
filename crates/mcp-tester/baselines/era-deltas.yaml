# =============================================================================
# EXPECTED-DIFFERENCE BASELINE — MCP 2025-11-25 (v1) vs MCP 2026-07-28 (v2)
# =============================================================================
#
# THIS FILE IS THE WRITTEN STATEMENT OF WHAT "DUAL-VERSION" MEANS FOR THIS SDK.
#
# Every entry below is a difference that is CORRECT BY DESIGN.
#
#   * Any observed v1/v2 difference NOT listed here is a FINDING.
#   * Any entry here that no longer reproduces is ALSO a FINDING — either the
#     spec moved, or we regressed.
#
# REVIEW THIS FILE LIKE A SPEC, NOT LIKE CONFIG. It is the input to Phase 118's
# conformance work, and maintaining it IS the dual-version contract, not
# overhead on top of it.
#
# -----------------------------------------------------------------------------
# WHY YAML AND NOT TOML
# -----------------------------------------------------------------------------
# `serde_yaml = "0.9"` is ALREADY a dependency of `mcp-tester`
# (crates/mcp-tester/Cargo.toml:26) and already loads checked-in data files in
# `src/scenario.rs:232-238` (`TestScenario::from_yaml_file`); this crate's own
# scenarios ship as `scenarios/*.yaml`. Adding the `toml` crate would be a NEW
# dependency on an already-published 0.7.0 crate, which the CLAUDE.md package
# discipline requires justifying — and it would buy nothing. Comment support is
# the only property "legible enough to review as a spec artifact" actually
# needs, and YAML has it.
#
# -----------------------------------------------------------------------------
# THE FIELDS
# -----------------------------------------------------------------------------
#   id             Stable human-facing label, `ERA-NN`. Unique. Never reused.
#
#   observation_id The STABLE, MACHINE-FACING name of the WIRE FACT this entry
#                  is about — namespaced, lowercase, dot-separated. It is NOT a
#                  human-facing test name and MUST NEVER be renamed for
#                  readability.
#
#                  Its reason: plan 117-11 joins the observed v1/v2 difference
#                  set against this field. `TestResult`
#                  (crates/mcp-tester/src/report.rs:73-81) carries only
#                  `{name, category, status, duration, error, details}` — no
#                  header, no session id, no result-envelope key, no HTTP
#                  status — so a comparison keyed on human-facing test names
#                  could never OBSERVE most of the entries below and would
#                  report permanent false MISSING findings. Every value here is
#                  unique; 117-11 adds one probe per value plus a two-direction
#                  coverage test between the probe registry and this file.
#
#   subject        Human-readable wire surface the entry concerns.
#   v1 / v2        What each era does. Short tokens, not prose.
#   kind           Difference class, for grouping in a report.
#
#   source         Citation a reviewer can check WITHOUT READING RUST. Every
#                  line reference below was opened and confirmed while this file
#                  was written; the ones the phase research cited at a stale line
#                  are corrected here and the correction is recorded in
#                  117-08-SUMMARY.md.
#
#   note           Optional prose. REQUIRED on provisional entries, where it
#                  must name the phase that owns the entry.
#
#   provisional    `true` when the owning phase is not signed off, so a change
#                  there produces a LEGIBLE BASELINE EDIT rather than a mystery
#                  test failure. Phase 114's task surface is PROVISIONAL per
#                  117 D-09, and the 2026-07-28 result envelope is still
#                  settling pending the final schema.json.
# =============================================================================

schema_version: 1
v1_protocol: "2025-11-25"
v2_protocol: "2026-07-28"

deltas:
  - id: ERA-01
    observation_id: method.initialize
    subject: "method:initialize"
    v1: served
    v2: absent
    kind: method-removed
    source: ".planning/REQUIREMENTS.md:911 (CLNT-01); src/client/mod.rs:761 (v2_synthetic_initialize_result); src/server/streamable_http_server.rs:1409 (V2_RETIRED_METHODS)"
    note: >-
      BOTH HALVES ARE NOW SEVERED. A v2 client's InitializeResult is LOCAL AND
      SYNTHETIC — no byte of it came from the server; and since phase 118.1 plan
      05 (gap G-5) the SERVER refuses a well-formed v2 `initialize` with -32601
      and HTTP 404. Until that plan the delta was real of the CLIENT ONLY and the
      dual run reported it MISSING, which was the tool working. The v1/v2/kind
      values above are UNCHANGED across that fix: they were right while the
      server still served the method, and the server caught up to them — the
      spec artifact was not rewritten to quieten a comparison. Fences:
      tests/v2_retired_methods.rs (pmcp side),
      crates/mcp-tester/tests/dual_run.rs (tester side).
    provisional: false

  - id: ERA-02
    observation_id: method.server_discover
    subject: "method:server/discover"
    v1: "error:-32601"
    v2: served
    kind: method-added
    source: "src/client/mod.rs:722 (a v1 server answers -32601); src/server/core.rs:1180 (project_capabilities_for_v2)"
    note: >-
      v2 replaces the initialize handshake with a read-only capability
      projection.
    provisional: false

  - id: ERA-03
    observation_id: header.mcp_session_id
    subject: "header:Mcp-Session-Id"
    v1: minted-and-echoed
    v2: never-minted-inbound-ignored
    kind: header-removed
    source: "src/server/streamable_http_server/v1_session.rs:333 (sessions_active_for); :552 (spec quote: \"ignore it, and do not mint or echo session IDs\")"
    provisional: false

  - id: ERA-04
    observation_id: header.mcp_method_and_name
    subject: "header:Mcp-Method,Mcp-Name"
    v1: not-sent
    v2: required-and-cross-checked
    kind: header-required-on-v2
    source: "src/shared/http_constants.rs:65,73 (MCP_METHOD, MCP_NAME); .planning/REQUIREMENTS.md VERS-05"
    note: >-
      A header/body desync is a smuggling signal and is rejected fail-closed.
    provisional: false

  - id: ERA-05
    observation_id: header.last_event_id
    subject: "header:Last-Event-ID / SSE resumability"
    v1: supported
    v2: ignored
    kind: feature-removed
    source: "src/server/streamable_http_server/v1_session.rs:400-420 (resumability era gate) and :433 (resumability_active_for); .planning/REQUIREMENTS.md:992 (standing out-of-scope ruling)"
    provisional: false

  - id: ERA-06
    observation_id: http.verb.get_delete
    subject: "http-verb:GET,DELETE on the MCP endpoint"
    v1: sse-stream-or-session-teardown
    v2: "status:405"
    kind: verb-rejected-on-v2
    source: "src/server/streamable_http_server.rs:1701 (v2_method_not_allowed) and :1712 (v2_verb_rejection)"
    note: >-
      Also gated on the server's v2 accept-list, so a v1-only server never
      answers 405 to a legitimate v1 GET.
    provisional: false

  # PROVISIONAL — owned by Phase 112 (result envelope). VERS-07's values are
  # filled only from the final 2026-07-28 schema.json, so this row can move.
  - id: ERA-07
    observation_id: result.result_type
    subject: "result-field:resultType"
    v1: absent
    v2: present
    kind: field-added-on-v2
    source: ".planning/ROADMAP.md:2241 (Phase 112 success criterion 5); Phase 112 D-07"
    note: >-
      Phase 112 owns this. Discriminator values are complete / input_required /
      task, defaulting to complete when absent; error codes are structurally
      omitted pending the final schema.json.
    provisional: true

  # PROVISIONAL — owned by Phase 112 (result envelope), same schema dependency
  # as ERA-07.
  - id: ERA-08
    observation_id: result.server_info
    subject: "result-field:serverInfo"
    v1: absent
    v2: present
    kind: field-added-on-v2
    source: ".planning/ROADMAP.md:2237 (Phase 112 success criterion 1)"
    note: >-
      Phase 112 owns this. v2 results carry serverInfo because there is no
      initialize response to carry it.
    provisional: true

  # PROVISIONAL — owned by Phase 114, whose task surface is PROVISIONAL per
  # 117 D-09.
  - id: ERA-09
    observation_id: method.tasks_list
    subject: "method:tasks/list,tasks/result"
    v1: served
    v2: "error:-32601"
    kind: method-removed
    source: ".planning/phases/114-tasks-extension-migration/114-CONTEXT.md:15 and :203 (D-15)"
    note: >-
      Phase 114 owns this and is NOT signed off. On v2 tasks/get inlines the
      result instead.
    provisional: true

  # PROVISIONAL — owned by Phase 114, same sign-off dependency as ERA-09.
  - id: ERA-10
    observation_id: capability.tasks_location
    subject: "capability:tasks"
    v1: "capabilities.tasks + experimental.tasks"
    v2: "extensions[io.modelcontextprotocol/tasks] = {}"
    kind: capability-relocated
    source: ".planning/phases/114-tasks-extension-migration/114-CONTEXT.md:52-60 (D-02) and :62-70 (D-03); src/server/core.rs:1168 and :1180"
    note: >-
      Phase 114 owns this. Both v1 spellings are SUPPRESSED on the v2 wire; the
      extension value is {} until the published schema fills it.
    provisional: true

  - id: ERA-11
    observation_id: result.cache_scope
    subject: "result-field:ttlMs,cacheScope on the 5 list/read results"
    v1: absent
    v2: required
    kind: field-required-on-v2
    source: ".planning/phases/115-json-schema-2020-12-structured-output-caching-hints/115-CONTEXT.md:74-87 (D-07, AMENDED 2026-08-01) and :88-98 (D-08)"
    note: >-
      REQUIRED, not optional — the schema declares CacheableResult with no `?`
      on either field. SDK default is ttlMs 0 / cacheScope private, the SAFE
      default rather than the convenient one.
    provisional: false

  - id: ERA-12
    observation_id: method.resources_subscribe
    subject: "method:resources/subscribe,resources/unsubscribe"
    v1: served
    v2: retired
    kind: method-retired
    source: ".planning/REQUIREMENTS.md:915 (CLNT-05); src/client/mod.rs:727 (reject_if_retired_on_v2); src/error/mod.rs:131 (RETIRED_ON_V2_MARKER)"
    note: >-
      The client fails fast with a typed retired_on_v2 error naming the
      replacement, rather than spending a round trip on an opaque -32601.
    provisional: false

  - id: ERA-13
    observation_id: method.subscriptions_listen
    subject: "method:subscriptions/listen"
    v1: "error:-32601"
    v2: sse-stream-capability-gated
    kind: method-added
    source: ".planning/phases/113-v2-transport-mrtr-subscriptions/113-CONTEXT.md:41 (D-13); src/server/streamable_http_server.rs:3223 (assemble_subscriptions_listen)"
    note: >-
      Capability-gated: a server advertising none of tools/prompts/resources
      listChanged or resources.subscribe and answering -32601 is
      SKIPPED-conformant, not failing.
    provisional: false

  - id: ERA-14
    observation_id: http.status.error_code_mapping
    subject: "http-status:JSON-RPC error code to HTTP status"
    v1: unchanged-legacy-table
    v2: era-gated-table
    kind: status-mapping-era-gated
    source: "src/server/streamable_http_server.rs:727 (v2_status_for_code); test status_mapping_is_era_gated_so_v1_is_untouched at :4734"
    provisional: false
