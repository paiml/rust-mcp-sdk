[server]
name = "fuzz-seed-extremely-long-url"
version = "0.0.1"

[database]
type = "postgres"
# REVIEWS M6 — extremely long env-var name (>10KB) to stress URL parsing.
url = "env:VERY_LONG_VAR_NAME_"
database = "test"

# --- Config slots (PKG-03) -----------------------------------------------
# Declared so this seed also packs: pmcp-package 0.3.1's CONFIG -> SLOT gate
# refuses an addressable `${VAR}` / `env:VAR` reference no slot names. The
# parser under fuzz stores these verbatim; `kind = "secret"` is identity-bearing
# and structurally carries no `tested_value`.

[[config_slots]]
key = "database.url"
kind = "secret"
name = "VERY_LONG_VAR_NAME_"
