[package]
name = "cargo-pmcp"
version = "0.28.1"
edition = "2021"
authors = ["PMCP SDK Contributors"]
description = "Production-grade MCP server development toolkit"
license = "MIT"
repository = "https://github.com/paiml/rust-mcp-sdk"
readme = "README.md"
keywords = ["mcp", "scaffold", "cli", "tools", "development"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "cargo_pmcp"
path = "src/lib.rs"

[[bin]]
name = "cargo-pmcp"
path = "src/main.rs"

# Phase 79 Wave 3 (Plan 79-03): test-only mock binary used by the
# `post_deploy_orchestrator` integration tests via the `PMCP_TEST_FIXTURE_EXE`
# env-var injection point, so `env!("CARGO_BIN_EXE_mock_test_binary")`
# resolves. It has no production purpose.
#
# `cargo install` installs EVERY `[[bin]]` target whose `required-features`
# are enabled, so from 0.13.0 through 0.28.0 `cargo install cargo-pmcp` put
# this helper into ~/.cargo/bin (#412; an earlier comment here said "NOT
# shipped", which was false). It is now gated behind the non-default
# `test-fixtures` feature, the same mechanism `capture_contract` uses below:
# a default build, and so `cargo install`, skips it. The test that needs it
# carries the same `required-features` (its `[[test]]` entry below), so a
# plain `cargo test -p cargo-pmcp` skips that test instead of failing to
# compile. `make test-cargo-pmcp-integration` runs it with
# `--features test-fixtures` and asserts a nonzero count for it.
[[bin]]
name = "mock_test_binary"
path = "tests/fixtures/mock_test_binary.rs"
test = false
bench = false
doctest = false
required-features = ["test-fixtures"]

# The only consumer of `mock_test_binary` (see its `[[bin]]` entry above).
[[test]]
name = "post_deploy_orchestrator"
path = "tests/post_deploy_orchestrator.rs"
required-features = ["test-fixtures"]

# Package-capture contract seam (Finding 1, final-review fix wave): internal
# M2M-auth introspection dev tool, NOT meant to ship to end users. Without an
# explicit [[bin]] + `required-features`, Cargo auto-discovers every file
# under src/bin/ as a default [[bin]], so `cargo install cargo-pmcp` would
# install this onto users' PATH. `required-features` makes the default build
# (and thus `cargo install` with default features) skip it entirely; it only
# builds with `--features capture-contract-tool`.
[[bin]]
name = "capture_contract"
path = "src/bin/capture_contract.rs"
required-features = ["capture-contract-tool"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"
walkdir = "2"
colored = "3"
indicatif = "0.18"
dirs = "7"
dotenvy = "0.15"
glob = "0.3"
# For load testing metrics
hdrhistogram = "7.5"
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["rt"] }
# The pin names the minor that ships `CredentialStore` / `FileCredentialStore`
# (Phase 116). `path` wins locally, but a published cargo-pmcp 0.19.0 claiming
# compatibility with an older pmcp would not compile: `auth_cmd` resolves every
# credential through that seam.
pmcp = { version = "2.20.3", path = "..", features = ["streamable-http", "oauth"] }
mcp-tester = { version = "0.8.0", path = "../crates/mcp-tester" }
# Collects the SDK's `pmcp::wire` tracing target for `--dump-wire`. The SDK emits
# those events unconditionally-but-guarded; without a subscriber installed here
# they would go nowhere, which is exactly the gap `--dump-wire` closes.
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
mcp-preview = { version = "0.3.1", path = "../crates/mcp-preview" }
pmcp-workbook-compiler = { version = "0.4", path = "../crates/pmcp-workbook-compiler" }
# Why (Phase 128 Q5): `cargo pmcp validate config` and `cargo pmcp validate deploy`
# must report the SAME findings a running config-driven server reports at startup,
# so both surfaces call ONE implementation — `ServerConfig::lint()` — rather than
# the CLI re-deriving the uncapped-string and opt-out rules against a local TOML
# shape. Two copies of a security rule is the drift class this repo has already
# been bitten by; route C of RESEARCH Finding 11b was rejected for exactly that.
#
# This is the first DIRECT toolkit edge, NOT the first edge. The toolkit already
# reaches this CLI transitively through `pmcp-workbook-compiler` immediately above
# (`crates/pmcp-workbook-compiler/Cargo.toml:113` pins it with
# `default-features = false, features = ["workbook", "input-validation"]`). A future
# reader measuring the graph will find the toolkit there too — that is expected.
#
# `default-features = false` is LOAD-BEARING: the toolkit's `default` is
# `["code-mode", "input-validation"]`, and `code-mode` drags the SWC/JS engine into
# a widely-installed CLI. `cargo tree -p cargo-pmcp -e normal -i swc_common` must
# keep finding nothing.
#
# `http` is required, not optional: `ServerConfig.backend` is
# `#[cfg(feature = "http")]` (`crates/pmcp-server-toolkit/src/config.rs:123`) and
# `ServerConfig` carries `#[serde(deny_unknown_fields)]` (`:101`), so a toolkit
# compiled WITHOUT `http` rejects every config carrying a `[backend]` section with
# `unknown field 'backend'` — and `[backend]` is present in every single-call HTTP
# and OpenAPI config, i.e. exactly the configs this command exists to lint.
# `input-validation` is what compiles the placeholder-floor lint arm.
pmcp-server-toolkit = { version = "0.4.1", path = "../crates/pmcp-server-toolkit", default-features = false, features = ["input-validation", "http"] }
# Phase 110 agent/team/package verbs. Path wins locally; the version req applies
# at publish (design §5: cargo-pmcp now publishes AFTER all three).
# `openai-compat` enables the default `agent dev` completion source.
pmcp-agent = { version = "0.4", path = "../crates/pmcp-agent", features = ["openai-compat"] }
# `runtime` = the in-process team-dev server set; `http` = the HTTP-first
# `team dev --serve` path AND transitively enables `member-llm` (so `team dev
# --llm` works with `http` alone — do NOT list `member-llm` explicitly).
pmcp-team-servers = { version = "0.3", path = "../crates/pmcp-team-servers", features = ["runtime", "http"] }
# Caret "0.3" exactly (CLI-04 / D-04b — `tests/pmcp_package_pin.rs` asserts this
# literal string; do NOT use `=0.3.0` or a fully-qualified `0.3.0`). Moved off
# the 0.1 line by the D-08/D-09 wire break in Phase 120, and off the 0.2 line by
# Phase 122's four source-breaking attestation-carriage changes.
pmcp-package = { version = "0.4", path = "../crates/pmcp-package" }
# CFN-renderer extraction, Task 7: the pmcp_run deploy target synthesizes its
# CloudFormation template via this pure renderer instead of `npx cdk synth`
# whenever `deploy/lib/stack.ts` is unmodified from the regenerated scaffold.
pmcp-cfn-renderer = { version = "0.3", path = "../crates/pmcp-cfn-renderer" }
# The `agent new` scaffold builds a starter `AgentPackage` from the real struct
# (guaranteeing the emitted agent.package.json round-trips); its `version` field
# is a `semver::Version`, so cargo-pmcp needs semver directly (matches the
# pmcp-package pin).
semver = "1"
# Why (WBCL-05): the `--kind workbook-server` scaffold embeds the sample
# tax-calc bundle + source .xlsx INTO the published cargo-pmcp binary via
# `include_dir!`/`include_bytes!` so the assets survive `cargo publish` (they
# live under src/templates/workbook_bundle/, inside the package root). Pinned to
# the same 0.7.4 the toolkit's EmbeddedSource uses.
include_dir = "0.7.4"
urlencoding = "2"
async-trait = "0.1.89"
pathdiff = "0.2.3"
cargo_metadata = "0.23"

# For pmcp-run target and landing pages
oauth2 = "5.0"                          # OAuth 2.0 authentication
reqwest = { version = "0.13", features = ["json", "multipart", "rustls", "form"], default-features = false }  # HTTP client with multipart support
tiny_http = "0.12"                      # OAuth callback server
open = "5.0"                            # Browser launch
chrono = "0.4"                          # Token expiry handling
rpassword = "7.3"                       # Secret input (for other features)
zip = "8.1"                             # Zip file creation for landing page deployment
# Phase 123 (PKGX-02): the `package save`/`package load` artifact codec. An
# uncompressed tar is the MOVABLE form of an OCI image layout (D-11); the layout
# directory stays the working form. Deliberately added HERE and NOT to
# `crates/pmcp-package/Cargo.toml` (D-12) so the format crate's allowlist and its
# measured 90-package graph are untouched. Sits beside `zip`, the existing
# archive-dependency precedent. Maintainership provenance was verified by a human
# on 2026-08-26 before this line was written — see `123-01-SUMMARY.md`.
tar = "0.4"
# Named directly because `commands/package/artifact.rs` must NAME `MediaType`,
# `Descriptor`, `ImageIndex` and `ImageManifest` in its own public types —
# `pmcp-package` re-exports none of them, and `OciLayout::write_blob` REQUIRES a
# `MediaType` per blob. Already resolved in the graph via `pmcp-package`, so this
# adds no package; the version requirement matches that crate's own `0.10` so the
# workspace unifies on one copy and the types cross the crate boundary.
oci-spec = "0.10"

# For schema discovery and code generation
console = "0.16"                        # Terminal styling for schema commands
# 3.15 is the floor, not "3": `package load`'s transactional install persists its
# staging directory with `TempDir::keep()`, which landed in 3.15 (the older
# `into_path()` alias is deprecated). `path` deps hide this locally — the
# requirement is what a published cargo-pmcp resolves against.
tempfile = "3.15"                       # Temp dirs/files across scaffold + publishing paths
thiserror = "2"                         # Error types for generated code
# NOT for credential-cache keys any more: `auth_cmd` normalizes through
# `pmcp::shared::credential_store::normalize_server_key`. Still used directly by
# `commands::team::dev` for endpoint parsing.
url = "2"

# For secrets management
secrecy = { version = "0.10", features = ["serde"] }  # Secure secret handling with zeroization
zeroize = "1"                           # Secure memory clearing
rand = "0.10"                            # Random secret generation
regex = "1"                             # Secret reference parsing

# AWS SDK. `aws-config` is a REQUIRED (non-optional) base dependency as of
# Task 9 (CFN deploy engine): the `aws-lambda` deploy target's default,
# unmodified-scaffold path now deploys via real `aws-sdk-sts`/`aws-sdk-s3`/
# `aws-sdk-cloudformation` calls instead of `npx cdk deploy` — that is the
# whole point of the engine (switch the target off Node/CDK entirely), so it
# cannot be gated behind an opt-in feature the way `aws-sdk-secretsmanager`
# (a separate, still-optional AWS Secrets Manager *provider*) is.
# Why default-features=false: default features enable `rustls` →
# aws-smithy-runtime/tls-rustls → aws-smithy-http-client/legacy-rustls-ring →
# rustls 0.21 / rustls-webpki 0.101 (RUSTSEC-2026-0098/0099/0104). Opt into
# the modern `default-https-client` path (rustls 0.23 via aws-lc-rs) instead.
aws-config = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "credentials-process", "sso", "behavior-version-latest"] }
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"], optional = true }
# Task 9: account resolution (`GetCallerIdentity`), artifact upload + bucket
# management, and stack create/update/describe/poll — see
# `deployment/targets/aws_lambda/engine.rs`.
aws-sdk-sts = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
aws-sdk-cloudformation = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
# `deploy destroy` on aws-lambda deletes a function's `/aws/lambda/<name>` log
# group after the stack is gone (#407): CloudFormation deletes the stack's own
# log group BEFORE the function (its name refers to the function), and Lambda
# can re-create it from the function's last log delivery in between. Same
# SDK family, client and features as the three above; 1.156 resolves to the
# smithy crates those already use (no second copy in the graph).
aws-sdk-cloudwatchlogs = { version = "1.156", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }

# For security penetration testing
serde-sarif = "0.8"
governor = "0.10"
sha2 = "0.11"
base64 = "0.23"

[dev-dependencies]
mockito = "1"
proptest = "1"
serial_test = "4"
assert_cmd = "2"
predicates = "3"
apollo-compiler = "1"

[features]
default = []
# `aws-config` moved to an always-on base dependency (Task 9) — no longer
# listed here since Cargo rejects a non-optional dependency named as an
# implicit feature.
aws-secrets = ["aws-sdk-secretsmanager"]
# Gates the `capture_contract` internal dev binary (see its [[bin]] entry
# above and its module doc) — a manual M2M-auth GraphQL introspection aid,
# not intended for end-user installs.
capture-contract-tool = []
# Builds the `mock_test_binary` test helper and the `post_deploy_orchestrator`
# integration test that execs it (see their entries above). Test-only; never
# enable it for an install (#412).
test-fixtures = []
