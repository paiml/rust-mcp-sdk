[package]
name = "cargo-pmcp-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
cargo-pmcp = { path = ".." }
toml = "0.9"
# `fuzz_package_artifact` re-derives each accepted blob's sha256 DIRECTLY rather
# than through `pmcp_package::ManifestDigest`, so the invariant does not share an
# implementation with the reader it is checking. A check that calls the same
# helper as the code under test cannot notice that helper changing.
sha2 = "0.10"

# Prevent this from interfering with workspace
[workspace]

[[bin]]
name = "fuzz_config_parse"
path = "fuzz_targets/fuzz_config_parse.rs"
doc = false

[[bin]]
name = "fuzz_metrics_record"
path = "fuzz_targets/fuzz_metrics_record.rs"
doc = false

[[bin]]
name = "fuzz_breaking_point"
path = "fuzz_targets/fuzz_breaking_point.rs"
doc = false

[[bin]]
name = "fuzz_iam_config"
path = "fuzz_targets/fuzz_iam_config.rs"
doc = false
test = false
bench = false

[[bin]]
name = "pmcp_config_toml_parser"
path = "fuzz_targets/pmcp_config_toml_parser.rs"
doc = false
test = false
bench = false

[[bin]]
name = "fuzz_widgets_config"
path = "fuzz_targets/fuzz_widgets_config.rs"
doc = false
test = false
bench = false

[[bin]]
name = "fuzz_azure_config"
path = "fuzz_targets/fuzz_azure_config.rs"
doc = false
test = false
bench = false

[[bin]]
name = "fuzz_metadata_config"
path = "fuzz_targets/fuzz_metadata_config.rs"
doc = false
test = false
bench = false

[[bin]]
name = "fuzz_package_kind"
path = "fuzz_targets/fuzz_package_kind.rs"
doc = false
test = false
bench = false

# Phase 123-07 (PKGX-02): the untrusted artifact-tar boundary behind
# `package load` / `package pull`, reached through the `package_artifact` lib
# seam (`cargo-pmcp/src/lib.rs`) because `commands/package/artifact.rs` is
# otherwise bin-only.
[[bin]]
name = "fuzz_package_artifact"
path = "fuzz_targets/fuzz_package_artifact.rs"
doc = false
test = false
bench = false
