[package]
name = "spike-011-three-mechanisms-one-task"
version = "0.1.0"
edition = "2021"
publish = false

# Deps beyond baseline: pmcp-agent (surface C is the delegated agent loop).
[workspace]

[dependencies]
pmcp = { path = "../../..", default-features = false, features = ["skills"] }
pmcp-agent = { path = "../../../crates/pmcp-agent" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
async-trait = "0.1"
serde_json = "1"
anyhow = "1"

[[bin]]
name = "spike-011"
path = "src/main.rs"
