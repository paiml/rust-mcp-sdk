[package]
name = "pmcp"
version = "2.19.2"
edition = "2021"
authors = ["PAIML Team"]
description = "High-quality Rust SDK for Model Context Protocol (MCP) with full TypeScript SDK compatibility"
license = "MIT"
repository = "https://github.com/paiml/pmcp"
homepage = "https://github.com/paiml/pmcp"
documentation = "https://docs.rs/pmcp"
readme = "README.md"
keywords = ["mcp", "model-context", "sdk", "ai", "llm"]
categories = ["api-bindings", "asynchronous", "network-programming"]
rust-version = "1.91.0"
exclude = [
    "docs/",
    "packages/",
    "tests/playwright/",
    "benches/*.bak",
    "fuzz/",
    "examples/mcp-apps-chess/",
    "examples/mcp-apps-map/",
    "examples/wasm-client/",
    "examples/wasm-mcp-server/",
    "examples/cloudflare-worker-mcp/",
    "examples/26-server-tester/",
    "examples/27-course-server-minimal/",
    "examples/25-oauth-basic/",
    "examples/test-basic/",
    "examples/wasm/",
    "pmcp-book/",
    "pmcp-course/",
    "examples/60_tasks_basic.rs",
    "examples/62_task_workflow_lifecycle.rs",
    "examples/65_durable_mcp_agent.rs",
    # PMAT / PV tooling metadata — not part of the published crate.
    # .pmat/context.db alone is ~21MB and blew past the 10MB crates.io limit
    # during the v2.2.0 release. Keep these out of every future release.
    ".pmat/",
    ".pv/",
    "contracts/",
    # Reads contracts/team-servers-v1.yaml at runtime; contracts/ is excluded
    # above (crates.io size limit), so shipping this test would break a
    # downstream `cargo test` on the published crate — keep it out too.
    "tests/team_contracts_conformance.rs",
    # Same reason: reads contracts/binding.yaml and
    # contracts/mcp-protocol-sdk-v1.yaml at runtime and panics when they are
    # absent, which is exactly what a published-crate `cargo test` would hit.
    "tests/phase115_contract_bindings.rs",
    # Same reason once more: the keyword-list drift gate reads
    # fuzz/fuzz_targets/fuzz_schema_draft_pin.rs at runtime to compare the third
    # restated copy of SUBSCHEMA_MAP_KEYWORDS, and `fuzz/` is excluded above.
    # Shipping it would make `cargo test` panic on the published crate.
    "tests/keyword_list_mirrors.rs",
    # The pinned @modelcontextprotocol/conformance suite (Node manifest, lockfile
    # and .npmrc) is CI tooling, never crate content — measured: without this entry
    # `cargo package --list` shipped all three files. 115-REVIEW.md CR-01 is the
    # precedent for what a stray CI-only artifact costs downstream.
    # tests/ci_conformance_gate_wiring.rs reads all three of
    # conformance/package.json, conformance/package-lock.json and
    # conformance/README.md at runtime — the first two to reconcile the suite
    # version pin across the manifest and the lockfile `npm ci` installs from, the
    # third for that pin's prose and the two-pin reconciliation. Shipping the
    # reader while excluding the paths it reads would make `cargo test` panic on
    # the published crate — the same disposition as
    # tests/team_contracts_conformance.rs above. The two entries must never be
    # split: ship both or exclude both.
    # The other two in-tree dispositions were rejected here on purpose.
    # tests/ci_severance_gate_wiring.rs SHIPS because everything it reads
    # (.github/workflows/ci.yml, scripts/run-severance-proofs.sh) also ships, so
    # consistency — not exclusion — is what keeps it honest; that option is closed
    # here because conformance/ cannot ship. tests/v2_conformance_pin.rs SHIPS while
    # reading the EXCLUDED .planning/ tree because it returns early on a missing
    # path, and that tolerance is deliberate there (the pin degrades to a no-op
    # downstream) but WRONG for the conformance reader, whose whole job is to fail
    # when the wiring is absent — a reader that silently skips is exactly the
    # vacuous gate Phase 118 exists to prevent.
    "conformance/",
    "tests/ci_conformance_gate_wiring.rs",
    # GSD phase planning (6.3MB) and presentation decks (5.6MB) — workspace
    # scaffolding, not crate content. Also blew the 10MB limit during v2.2.0.
    ".planning/",
    "presentations/",
    # Why: the D-03 disclosure tripwire reads BOTH .planning/WINDOWS.md and
    # pmcp-book/src/ch12-17-migrating-to-mcp-2026-07-28.md at runtime, and both
    # trees are excluded above. THIS ENTRY IS LOAD-BEARING, and the reason is
    # precise: the test keeps the tolerant absent-tree guard (it returns early
    # rather than panicking, so a sparse checkout is not a false red). Downstream,
    # BOTH trees are absent, so a shipped copy would take that early return and
    # PASS SILENTLY — the vacuous green this gate exists to prevent. Excluding it
    # is what removes that path; the in-file guard does not, and cannot.
    #
    # (Contrast, stated accurately because an earlier version of this note got it
    # backwards: tests/ci_conformance_gate_wiring.rs panics on a missing input, so
    # shipped it would fail LOUDLY, and its exclusion prevents a downstream red
    # rather than a downstream false green. tests/v2_conformance_pin.rs takes the
    # tolerant shape deliberately, since a pin degrading to a no-op downstream is
    # acceptable. This file takes the tolerant shape but is NOT tolerant of a
    # vacuous pass — hence exclusion, not a shape change.)
    #
    # This entry and the two paths it reads must never be split: exclude all three
    # or ship all three. That invariant is prose only — nothing enforces it.
    "tests/windows_disclosure_tripwire.rs",
    # Same disposition as the four readers above, for a different missing input:
    # two of this file's three legs run example binaries owned by
    # `crates/pmcp-agent` and `crates/pmcp-team-servers`, and those directories
    # carry their own Cargo.toml so cargo never packages them into `pmcp`. The
    # leg FAILS rather than skips when a binary is absent — deliberately — so a
    # shipped copy would panic under a downstream `cargo test` on the published
    # crate with a binary it has no way to build. Its sibling
    # tests/docs06_v2_examples_run.rs SHIPS, because every example it runs is a
    # ROOT `examples/` target that does ship and that `cargo test` builds.
    "tests/docs04_examples_run.rs",
]

[dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value", "preserve_order"] }
schemars = { version = "1.0", optional = true }
pmcp-macros = { version = "0.6.1", path = "pmcp-macros", optional = true }
async-trait = "0.1"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
http = "1.1"

# Utility dependencies (needed on all platforms)
glob = "0.3"
url = "2.5"
toml = "1.0"
uuid = { version = "1.17", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
regex = "1.11"
urlencoding = "2.1"
indexmap = { version = "2.10", features = ["serde"] }
smallvec = { version = "1.13", features = ["serde", "union"] }
parking_lot = "0.12"
dashmap = "6.1"
bytes = { version = "1.10", optional = true }
futures = "0.3"
pmcp-widget-utils = { path = "crates/pmcp-widget-utils", version = "0.1.0" }
futures-util = { version = "0.3", optional = true }
futures-channel = { version = "0.3", optional = true }
futures-locks = { version = "0.7", optional = true, default-features = false }
http-body-util = "0.1"

# OAuth dependencies
sha2 = "0.11"
base64 = "0.23"
jsonwebtoken = { version = "11.0", optional = true }

# Cross-target CSPRNG for the wasm-safe PKCE helper (src/shared/pkce.rs).
# HIGH-1: must be a NORMAL [dependencies] entry so the ungated pkce module links
# on the HOST target too — the wasm32 target below keeps the `wasm_js` backend
# feature; getrandom 0.4 selects its backend per-target (host uses the OS backend).
getrandom = "0.4"

# Cross-target monotonic clock. `std::time::Instant::now()` PANICS on
# wasm32-unknown-unknown ("time not implemented on this platform"), which aborts
# every `Client::send_request` in the browser because `MiddlewareContext::default()`
# stamps a `start_time: Instant`. `web_time::Instant` IS `std::time::Instant` on
# native targets (zero behavior change) and is backed by `performance.now()` on wasm.
# Normal [dependencies] entry so the shared `middleware` module links on host AND wasm.
web-time = "1"

# OAuth CLI helper dependencies (feature-gated)
webbrowser = { version = "1", optional = true }
dirs = { version = "6", optional = true }
rand = { version = "0.10", optional = true }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"], optional = true }

# Transport dependencies (optional, feature-gated)
tokio-tungstenite = { version = "0.30", optional = true }
hyper = { version = "1.6", features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "http1", "server-auto", "client-legacy"], optional = true }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "tls12", "ring", "native-tokio"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
axum = { version = "0.8.5", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.7", features = ["cors", "set-header"], optional = true }
# Already in the dependency tree transitively via `rustls`'s `ring` feature; promoted to an
# explicit optional dep so `pmcp`'s own production code can `use ring::aead;` for the v2
# `requestState` AEAD token (D-14, native-only — deliberately NOT reachable from wasm32).
ring = { version = "0.17", optional = true }
# Already in the dependency tree transitively via the rustls crypto chain; promoted to an
# explicit optional dep so `src/server/request_state.rs` can scrub the decoded key buffer
# (the accepted mitigation for threat T-113-05). Default features are deliberately LEFT ON:
# `default = ["alloc"]`, and the `Zeroize` impls for `Vec<u8>`/`String` live behind `alloc`.
# The `derive` feature is deliberately NOT enabled — it would pull `zeroize_derive` into
# `pmcp`'s own dependency tree.
zeroize = { version = "1.8", optional = true }

# File watching dependencies (optional, feature-gated)
notify = { version = "8.2", optional = true }
glob-match = { version = "0.2", optional = true }

# Validation (optional, feature-gated)
#
# Why "0.49" and not the "0.48" SCHM-01's literal wording names (Phase 115 Plan 03,
# recorded deviation): 0.49.2 is the latest release (2026-07-27) and 0.49.0 is purely
# ADDITIVE over 0.48 (`options_for`, `meta::validate_for`, one `multipleOf` correctness
# fix, no breaking change), while 0.48.0-0.48.2 carry the packaging defects that
# 0.48.3/0.48.4/0.48.5 exist to fix. A caret "0.49" also cannot drift into 0.50.
# An exact `= 0.49.2` pin was deliberately DECLINED: `pmcp` is a published library, and
# an `=` requirement forces every downstream consumer onto exactly that patch, turning
# any future `jsonschema` security patch into a breaking change for them.
#
# `optional` and `default-features = false` are LOAD-BEARING and must survive verbatim:
# jsonschema's defaults are ["resolve-http", "resolve-file", "tls-aws-lc-rs"], which pull
# reqwest + rustls, break the wasm build, and turn an external `$ref` from a hard error
# into a live network fetch (SEP-2106).
jsonschema = { version = "0.49", optional = true, default-features = false }
garde = { version = "0.23", optional = true }

# SIMD support (optional)
rayon = { version = "1.10", optional = true }

# Platform-specific dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.46", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "fs", "sync", "time", "process", "signal"] }
tokio-stream = { version = "0.1.15" }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.13", optional = true, default-features = false, features = ["json", "rustls", "form"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "Window", "Document", "WebSocket", "MessageEvent", "CloseEvent", "ErrorEvent", "BinaryType", "Headers", "Request", "RequestInit", "Response"] }
js-sys = "0.3"
futures-channel = "0.3"
futures-locks = { version = "0.7", default-features = false }
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
# Testing
tempfile = "3.19"
proptest = "1.7"
quickcheck = "1.0"
quickcheck_macros = "1.1"
rstest = "0.26"
mockall = "0.15"
pretty_assertions = "1.4"
test-case = "3.3"
criterion = { version = "0.8", features = ["html_reports"] }
insta = { version = "1.43", features = ["json", "redactions"] }
mockito = "1.5.0"
tokio-util = { version = "0.7", features = ["rt"] }
serde_yaml = "0.9"  # Consumer: tests/ci_severance_gate_wiring.rs (parses .github/workflows/ci.yml). Version matches crates/mcp-tester/Cargo.toml:26, so no new package enters the graph.

# For examples
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
dashmap = "6.1"  # Already in main deps but needed for examples
pmcp-macros = { version = "0.6.1", path = "pmcp-macros" }  # For macro examples (s23_mcp_tool_macro)
pmcp-code-mode = { version = "0.5.3", path = "crates/pmcp-code-mode" }  # For code mode example (s41)
pmcp-code-mode-derive = { version = "0.3.0", path = "crates/pmcp-code-mode-derive" }  # For code mode example (s41)
# For the CLNT-03 agent example (s53_v2_agent_client): the era-aware connector
# factory lives behind pmcp-agent's non-default `url-connector` feature.
#
# PATH-ONLY, deliberately, unlike the three entries above. `crates/pmcp-agent` is
# at 0.2.0 (bumped by plan 117-07) and 0.2.0 is not on crates.io yet, while
# `.github/workflows/release.yml` publishes `pmcp` (line 198) long BEFORE
# `pmcp-agent` (line 489). A `version` key here would therefore make every
# `cargo publish -p pmcp` fail on an unresolvable dev-dependency. Cargo strips
# path-only dev-deps at publish time, and the `[[example]]` below carries
# `required-features` that `default` does not satisfy, so the publish VERIFY
# build skips the example rather than failing on the stripped dep.
pmcp-agent = { path = "crates/pmcp-agent", features = ["url-connector"] }  # For the agent example (s53_v2_agent_client)

[features]
default = ["logging", "v1-compat"]
full = ["websocket", "http", "streamable-http", "sse", "validation", "resource-watcher", "rayon", "schema-generation", "jwt-auth", "composition", "mcp-apps", "http-client", "logging", "macros", "testing", "v1-compat"]
# The SMPL-01 severance PROOF set: exactly what `full` has, EXCEPT `v1-compat`.
#
# `--no-default-features` alone proves nothing here, because `default = ["logging"]`
# — it would strip `http`/`streamable-http` too and "prove" v1 is severable by
# never compiling the transport at all. Hence a parallel positive list.
#
# `full` and `full-v2` are two enumerated lists that can DRIFT: a feature added to
# `full` and forgotten here silently SHRINKS the severance proof. That drift is a
# test failure — tests/v1_severability_tripwire.rs DERIVES both lists from THIS
# file at test time rather than re-enumerating them.
#
# An inverted `v2-only` feature was REJECTED (D-02): cargo features are additive
# and cannot be subtracted, so any crate anywhere in the dependency graph enabling
# a negative feature would silently strip v1 for every other consumer.
full-v2 = ["websocket", "http", "streamable-http", "sse", "validation", "resource-watcher", "rayon", "schema-generation", "jwt-auth", "composition", "mcp-apps", "http-client", "logging", "macros", "testing"]
# MCP 2025-11-25 compatibility layer: the initialize/session lifecycle and SSE
# resumability (`Last-Event-ID` + event store). SSE framing/parsing itself is
# SHARED with v2 and is deliberately NOT gated.
#
# Default-on, so no existing consumer changes behavior. Building WITHOUT it —
# `cargo build -p pmcp --no-default-features --features full-v2` — is the SMPL-01
# severance proof. Actually REMOVING it is SMPL-F1 / pmcp 3.0, gated on public
# client adoption of v2; see docs/v1-sunset-policy.md for the (date-free) policy.
#
# Dependency-free marker feature: do NOT add it to any other feature's list.
v1-compat = []
composition = ["streamable-http"]
# MCP Apps Extension - Interactive UI support for ChatGPT Apps, MCP-UI, and standard MCP hosts
mcp-apps = []
# SEP-2640 Skills support — Agent Skills as `ResourceHandler`-served resources
# plus a parallel prompt fallback. See `src/server/skills.rs` (gated module).
# Opt-in: NOT in `default`, NOT in `full`. Plan 80-02 fills the module.
skills = []
jwt-auth = ["http-client", "dep:jsonwebtoken"]
http-client = ["dep:reqwest"]
logging = ["dep:tracing-subscriber"]
oauth = ["http-client", "dep:webbrowser", "dep:dirs", "dep:rand"]
sse = ["http-client", "dep:bytes"]
websocket = ["dep:tokio-tungstenite"]
http = ["dep:hyper", "dep:hyper-util", "dep:bytes"]
streamable-http = ["dep:hyper", "dep:hyper-util", "dep:hyper-rustls", "dep:rustls", "dep:futures-util", "dep:bytes", "dep:axum", "dep:tower", "dep:tower-http", "dep:ring", "dep:zeroize"]
validation = ["dep:jsonschema", "dep:garde"]
resource-watcher = ["dep:notify", "dep:glob-match"]
schema-generation = ["dep:schemars"]
macros = ["dep:pmcp-macros", "schema-generation"]
wasm = ["websocket-wasm", "uuid/js", "dep:futures-channel", "dep:futures-locks"]
websocket-wasm = []
wasm-tokio = []
wasi-http = []  # Future: WASI HTTP support (not yet implemented)

# Example features
authentication_example = []
cancellation_example = []
progress_example = []

# Performance optimizations
unstable = []
simd = []
rayon = ["dep:rayon"]

# Internal test/fuzz support surface. NOT stable API, and deliberately absent
# from BOTH `default` and `full` so `cargo public-api` never sees the seam on the
# shipped surface. Only `fuzz/` enables it (see fuzz/Cargo.toml).
fuzzing = []

# Testing support
test-helpers = []
# Conformance helpers (pmcp::testing) — folded into `full` so the quality gate
# compiles the module AND runs the tasks-lifecycle integration test. NOT in
# `default`, so lean release builds omit it.
testing = []

