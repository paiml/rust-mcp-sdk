# Phase 113 (MCP 2026-07-28): the stateless multi-round-trip-elicitation pair.
# `s47_v2_stateless_mrtr` is the SERVER, `s48_v2_mrtr_client` the CLIENT that
# fulfils it automatically; run the server first.
#
# NOTE on the numbering: `s47_task_augmented_result` and `s48_durable_poll_decision`
# already occupy the s47/s48 slots. Cargo example NAMES are unique so both pairs
# build and run, but the `sNN_` sequence is no longer a bijection. Renaming these
# two to the next free slots is deferred: their paths are pinned by the Phase-113
# plan's artifact contract, and a rename would break the phase's acceptance
# record. See `.planning/phases/113-.../113-11-SUMMARY.md`.
[[example]]
name = "s47_v2_stateless_mrtr"
path = "examples/s47_v2_stateless_mrtr.rs"
required-features = ["streamable-http", "testing"]

[[example]]
name = "s48_v2_mrtr_client"
path = "examples/s48_v2_mrtr_client.rs"
required-features = ["streamable-http", "http-client"]

# Phase 113-13 (HTTP-04): the `subscriptions/listen` CLIENT stream. Unlike the
# s47/s48 pair this one is SELF-CONTAINED — it starts its own v2 server on an
# ephemeral loopback port — so it needs no companion process. The `sNN_`
# sequence is already not a bijection (see the note above); `s49_sampling_host`
# occupies the other `s49` slot.
[[example]]
name = "s49_v2_subscriptions_client"
path = "examples/s49_v2_subscriptions_client.rs"
required-features = ["streamable-http", "http-client"]

# Phase 115-09 (SCHM-02 + SCHM-03): the `2026-07-28` caching hints (`ttlMs` /
# `cacheScope`), their SDK defaults, the v1 era gate that strips them, and
# NON-OBJECT `structuredContent`. Self-contained: it starts its own v2-opted-in
# server on an ephemeral loopback port, asserts all four behaviours and exits.
#
# `testing` joins the two transport features because the example reads the
# reserved `_meta` key spellings from `pmcp::testing` (`META_PROTOCOL_VERSION`
# and friends) rather than hand-copying wire strings that could drift. It is
# folded into `full`, which is what the documented run command uses.
[[example]]
name = "s52_v2_caching_hints"
path = "examples/s52_v2_caching_hints.rs"
required-features = ["streamable-http", "http-client", "testing"]

# Phase 117-10 (CLNT-03): the `pmcp-agent` connector against BOTH eras — the v2
# happy path against the paired `s47_v2_stateless_mrtr` server, the v1 fallback
# against a v1-only server it starts in-process, and unreachable-host error
# propagation. Needs the `pmcp-agent` dev-dependency declared above for
# `UrlConnectorClientFactory`.
#
# NUMBERING, derived from what is on disk rather than from the sequence: `s47`
# and `s48` are each occupied twice, `s49` is occupied twice
# (`s49_sampling_host` + `s49_v2_subscriptions_client`), and `s50`/`s51`/`s52`
# all exist — so `s53` is the next free slot. See the bijection note above the
# `s47_v2_stateless_mrtr` block.
#
# `testing` is deliberately ABSENT (unlike `s52`): this example reads no
# reserved `_meta` key spelling of its own — the connector factory owns every
# wire detail — so the two transport features are the whole requirement.
[[example]]
name = "s53_v2_agent_client"
path = "examples/s53_v2_agent_client.rs"
required-features = ["streamable-http", "http-client"]

# Phase 118 (CONF-01): the dual-version conformance TARGET. The official
# `@modelcontextprotocol/conformance` suite (pinned in `conformance/`) is run
# against ONE instance of this server twice — once with `--requirements
# 2025-11-25` and once with `--requirements 2026-07-28` — which is what makes
# "one pmcp binary serves both eras" a measured claim rather than an assertion.
# Phase 119's DOCS-06 cites this example as the runnable v2 server.
#
# Its tool / resource / prompt names are DICTATED by that suite, not chosen:
# renaming one silently breaks the scenario that consumes it.
#
# NUMBERING: `s54` is the next free slot — `s47`/`s48`/`s49` are each occupied
# twice and `s50`/`s51`/`s52`/`s53` all exist. See the bijection note above the
# `s47_v2_stateless_mrtr` block.
#
# `testing` joins `streamable-http` for the same reason `s52` needs it: the
# example reads the reserved `_meta` key spellings from `pmcp::testing`
# (`META_PROTOCOL_VERSION`) rather than hand-copying wire strings that could
# drift. Both are folded into `full`, which is what the documented run command
# uses. Without this entry the example would carry no required-feature guard and
# a default-feature `cargo run --example` would fail to compile.
[[example]]
name = "s54_v2_dual_conformance"
path = "examples/s54_v2_dual_conformance.rs"
required-features = ["streamable-http", "testing"]

# The `extra.log(..)` ALWAYS-requirement example (Phase 118.2, CONF-10).
#
# NO `required-features`, and that is the point rather than an omission:
# `RequestHandlerExtra::log` / `log_with_data` / `with_log_sink` /
# `with_log_level` are all on the DEFAULT surface, so `cargo run --example
# s55_handler_logging` with no flags must work. Adding a guard here would hide
# a future regression that pushed the emitter behind a feature. `s43` (the
# handler-scoped example this one is modelled on) carries none for the same
# reason.
#
# It is declared explicitly even though `autoexamples` would discover it, so
# that the manifest — not the directory listing — is the record of which
# examples exist and what each one needs.
[[example]]
name = "s55_handler_logging"
path = "examples/s55_handler_logging.rs"

[[bench]]
name = "comprehensive_benchmarks"
harness = false
[workspace]
members = ["pmcp-macros", "crates/pmcp-macros-support", "crates/mcp-tester", "crates/mcp-preview", "crates/pmcp-server", "crates/pmcp-server/pmcp-server-lambda", "crates/pmcp-tasks", "crates/pmcp-agent", "crates/pmcp-cfn-renderer", "crates/mcp-e2e-tests", "crates/pmcp-widget-utils", "crates/pmcp-code-mode", "crates/pmcp-code-mode-derive", "crates/pmcp-server-toolkit", "crates/pmcp-toolkit-postgres", "crates/pmcp-toolkit-mysql", "crates/pmcp-toolkit-athena", "crates/pmcp-sql-server", "crates/pmcp-team-servers", "crates/pmcp-workbook-server", "crates/pmcp-openapi-server", "crates/pmcp-workbook-runtime", "crates/pmcp-workbook-dialect", "crates/pmcp-workbook-compiler", "examples/25-oauth-basic", "examples/test-basic", "cargo-pmcp"]
# WASM examples and standalone examples are excluded from regular workspace tests.
# crates/pmcp-package is workspace-excluded (it declares its own [workspace] table);
# it must be listed here so pmcp-agent's path dependency on it does not trip
# cargo's "multiple workspace roots" error (pmcp-agent is its first in-repo consumer).
exclude = ["fuzz", "crates/pmcp-package", "examples/cloudflare-worker-mcp", "examples/26-server-tester", "examples/27-course-server-minimal", "examples/wasm-client", "examples/web-channel-client/client", "examples/web-channel-client/server", "examples/mcp-apps-chess", "examples/mcp-apps-map", "examples/mcp-apps-dataviz"]

[package.metadata.docs.rs]
features = [
    "composition",
    "http",
    "http-client",
    "jwt-auth",
    "macros",
    "mcp-apps",
    "oauth",
    "rayon",
    "resource-watcher",
    "schema-generation",
    "simd",
    "sse",
    "streamable-http",
    "validation",
    # EXPLICIT, not inherited. `v1-compat` is a member of `default` and this block
    # does NOT set `no-default-features = true`, so docs.rs would document the
    # v1-gated surface either way — today. As of plan 117-06 that surface is real
    # (`crate::shared::event_store` and the `v1` paired module), so if anyone ever
    # adds `no-default-features = true` here it would vanish from docs.rs with no
    # error and no warning. Naming it makes the coverage a statement rather than a
    # side effect. Closes deferred item D-117-01-A.
    "v1-compat",
    "websocket",
]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]
